<aside class="sidebar" [class.collapsed]="isCollapsed">
  <div class="sidebar-header">
    <h2 *ngIf="!isCollapsed" class="sidebar-title">MENU</h2>
    <span *ngIf="isCollapsed" class="collapsed-title" title="MENU">☰</span>
  </div>

  <nav class="sidebar-nav">
    <ul class="nav-items">
      <li *ngFor="let item of menuItems" class="nav-item">
        <a 
          [routerLink]="item.route" 
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: true }"
          class="nav-link"
          [title]="item.label"
        >
          <span class="icon">{{ item.icon }}</span>
          <span *ngIf="!isCollapsed" class="label">{{ item.label }}</span>
          <span *ngIf="!isCollapsed && item.label === 'Notifications'" class="nav-badge" [class.badge-zero]="unreadCount === 0">
            {{ unreadCount }}
          </span>
        </a>
      </li>
    </ul>
  </nav>

  <div class="sidebar-footer">
    <button class="logout-btn" (click)="logout()" [title]="'Logout'">
      <span class="icon">🚪</span>
      <span *ngIf="!isCollapsed">Logout</span>
    </button>
  </div>
</aside>
