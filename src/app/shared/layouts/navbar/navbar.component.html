<nav class="navbar">
  <div class="navbar-content">
    <div class="navbar-left">
      <h2>UrbanClean - Dashboard</h2>
    </div>

    <div class="navbar-right">
      <!-- Notifications Button -->
      <button class="navbar-icon" (click)="goToNotifications()" title="Notifications">
        🔔
        <span *ngIf="unreadNotificationCount > 0" class="badge">{{ unreadNotificationCount }}</span>
      </button>

      <!-- Profile Menu -->
      <div class="profile-menu" [class.open]="showProfileMenu">
        <button class="profile-btn" (click)="toggleProfileMenu()">
          <span class="avatar">👤</span>
          <span class="user-name" *ngIf="currentUser">{{ currentUser.fullName }}<small>{{ currentUser.role }}</small></span>
          <span class="arrow">▼</span>
        </button>

        <div *ngIf="showProfileMenu" class="dropdown-menu">
          <a href="javascript:void(0)" (click)="goToProfile()" class="dropdown-item">
            👤 Profile
          </a>
          <a href="javascript:void(0)" (click)="logout()" class="dropdown-item logout">
            🚪 Logout
          </a>
        </div>
      </div>
    </div>
  </div>
</nav>
