<div class="login-container">
  <div class="login-card">
    <div class="login-header">
      <h1>UrbanClean</h1>
      <p>Digital Waste Collection & Recycling Platform</p>
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="login()" class="login-form">
      <!-- Error Message -->
      <div *ngIf="errorMessage" class="alert alert-error">
        <p class="error-msg-text">{{ errorMessage }}</p>
        <div *ngIf="isNotRegistered" class="unregistered-action">
          <a routerLink="/register" class="btn-register-inline">Register</a>
        </div>
      </div>

      <!-- Success Message -->
      <div *ngIf="successMessage" class="alert alert-success">
        {{ successMessage }}
      </div>

      <!-- Email Field -->
      <div class="form-group">
        <label for="email">Email</label>
        <input
          type="email"
          id="email"
          formControlName="email"
          placeholder="Enter your email"
          class="form-control"
          [class.is-invalid]="loginForm.get('email')?.invalid && loginForm.get('email')?.touched"
        />
        <small *ngIf="loginForm.get('email')?.hasError('required') && loginForm.get('email')?.touched" class="error-text">
          Email is required.
        </small>
        <small *ngIf="loginForm.get('email')?.hasError('email') && loginForm.get('email')?.touched" class="error-text">
          Please enter a valid email address.
        </small>
      </div>

      <!-- Password Field -->
      <div class="form-group">
        <label for="password">Password</label>
        <div class="password-input-group">
          <input
            [type]="showPassword ? 'text' : 'password'"
            id="password"
            formControlName="password"
            placeholder="Enter your password"
            class="form-control"
            [class.is-invalid]="loginForm.get('password')?.invalid && loginForm.get('password')?.touched"
          />
          <button
            type="button"
            class="password-toggle"
            (click)="togglePasswordVisibility()"
            title="Toggle password visibility"
            aria-label="Toggle password visibility"
          >
            {{ showPassword ? '👁️' : '🔒' }}
          </button>
        </div>
        <small *ngIf="loginForm.get('password')?.hasError('required') && loginForm.get('password')?.touched" class="error-text">
          Password is required.
        </small>
      </div>

      <!-- Login Button -->
      <button
        type="submit"
        class="btn btn-primary btn-block"
        [disabled]="loading"
      >
        {{ loading ? 'Logging in...' : 'Login' }}
      </button>
    </form>

    <!-- Register Option -->
    <div class="login-footer">
      <p class="register-prompt">Don't have an account?</p>
      <a routerLink="/register" class="register-link">Register</a>
    </div>
  </div>
</div>
