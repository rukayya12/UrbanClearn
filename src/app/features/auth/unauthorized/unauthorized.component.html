<div class="unauthorized-container">
  <div class="error-card">
    <div class="error-icon">🚫</div>
    <h1>Access Denied</h1>
    <p class="error-message">You don't have permission to access this page.</p>
    <p class="error-details">Please make sure you are logged in with the correct account role.</p>
    
    <div class="actions">
      <button class="btn btn-primary" (click)="goToLogin()">Go to Login</button>
      <button class="btn btn-secondary" (click)="goBack()">Go Back</button>
    </div>
  </div>
</div>
